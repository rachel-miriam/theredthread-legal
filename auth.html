<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>The Red Thread</title>
  <style>
    :root { --bg: #0d0c0c; --surface: #1a1717; --border: #2a2525; --text: #ece7e2; --muted: #8a8079; --red: #c0392b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center; -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 360px; width: 100%; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--red); margin: 0 auto 22px; box-shadow: 0 0 0 6px rgba(192,57,43,0.15); }
    h1 { font-size: 19px; font-weight: 600; margin: 0 0 10px; letter-spacing: 0.3px; }
    p { font-size: 14px; line-height: 1.5; color: var(--muted); margin: 0 0 26px; }
    a.btn {
      display: inline-block; width: 100%; padding: 15px 20px; border-radius: 10px;
      background: var(--red); color: #fff; text-decoration: none; font-size: 15px; font-weight: 600;
    }
    a.btn:active { opacity: 0.85; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 18px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="dot"></div>
    <h1>Opening The Red Thread…</h1>
    <p>Your email is confirmed. Tap below if the app doesn't open automatically.</p>
    <a id="open" class="btn" href="redthread://">Open The Red Thread</a>
    <div class="hint">Make sure The Red Thread is installed on this device.</div>
  </div>
  <script>
    // Supabase appends the session to this page as a URL fragment (#access_token=…,
    // and &type=recovery for password resets). Forward the whole thing into the app
    // via its custom scheme so the app can complete sign-in / recovery. Doing this
    // through an https page (instead of redirecting straight to redthread://) means it
    // also works from in-app browsers (Gmail, Outlook) that block scheme redirects.
    (function () {
      var frag = window.location.hash && window.location.hash.length > 1
        ? window.location.hash
        : (window.location.search && window.location.search.length > 1
            ? "#" + window.location.search.slice(1)
            : "");
      var target = "redthread://" + frag;
      document.getElementById("open").setAttribute("href", target);
      // Attempt to open the app automatically; the button is the fallback.
      setTimeout(function () { window.location.href = target; }, 350);
    })();
  </script>
</body>
</html>
