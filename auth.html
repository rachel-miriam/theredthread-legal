<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>The Red Thread</title>
  <style>
    :root { --bg: #0d0c0c; --surface: #1a1717; --border: #2a2525; --text: #ece7e2; --muted: #8a8079; --red: #c0392b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center; -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 360px; width: 100%; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--red); margin: 0 auto 22px; box-shadow: 0 0 0 6px rgba(192,57,43,0.15); }
    h1 { font-size: 19px; font-weight: 600; margin: 0 0 10px; letter-spacing: 0.3px; }
    p { font-size: 14px; line-height: 1.5; color: var(--muted); margin: 0 0 26px; }
    a.btn {
      display: inline-block; width: 100%; padding: 15px 20px; border-radius: 10px;
      background: var(--red); color: #fff; text-decoration: none; font-size: 15px; font-weight: 600;
    }
    a.btn:active { opacity: 0.85; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 18px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="dot"></div>
    <h1 id="title">Opening The Red Thread…</h1>
    <p id="msg">Your email is confirmed. Tap below if the app doesn't open automatically.</p>
    <a id="open" class="btn" href="redthread://">Open The Red Thread</a>
    <div class="hint" id="hint">Make sure The Red Thread is installed on this device.</div>
  </div>
  <script>
    (function () {
      // Supabase appends the result to this page — as a URL fragment on success
      // (#access_token=…&refresh_token=…&type=signup|recovery) or as an error
      // (#error=access_denied&error_code=otp_expired&…).
      var raw = window.location.hash && window.location.hash.length > 1
        ? window.location.hash.substring(1)
        : (window.location.search && window.location.search.length > 1
            ? window.location.search.substring(1) : "");
      var params = new URLSearchParams(raw);

      var title = document.getElementById("title");
      var msg = document.getElementById("msg");
      var btn = document.getElementById("open");
      var hint = document.getElementById("hint");

      // Expired / already-used / invalid link — never hand this to the app (there's
      // nothing it can do but error); show a clear message here instead.
      if (params.get("error") || params.get("error_code") || params.get("error_description")) {
        title.textContent = "This link has expired";
        msg.textContent = "Email links can only be used once and expire after a while. Open The Red Thread, go to sign in, and tap “Resend confirmation” — or sign up again to get a fresh link.";
        btn.style.display = "none";
        hint.style.display = "none";
        return;
      }

      // Success: hand the session to the app via a QUERY string (a fragment gets
      // percent-mangled through the custom-scheme hand-off and breaks routing).
      var target = "redthread://?" + raw;
      btn.setAttribute("href", target);
      // Try to open automatically; the button is the user-gesture fallback.
      setTimeout(function () { window.location.href = target; }, 400);
    })();
  </script>
</body>
</html>
